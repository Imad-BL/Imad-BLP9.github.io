<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Paiement Sécurisé | Démo Marina Car</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .demo-body { background: #f8f9fa; color: #333; padding-top: 100px; min-height: 100vh; }
        .payment-container { max-width: 500px; margin: 2rem auto; background: #fff; padding: 2rem; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
        .step-indicator { display: flex; justify-content: space-between; margin-bottom: 2rem; }
        .step { width: 30px; height: 30px; border-radius: 50%; background: #eee; display: flex; align-items: center; justify-content: center; font-size: 0.8rem; }
        .step.active { background: var(--primary); color: #fff; }
        .payment-method { border: 2px solid #eee; padding: 1rem; border-radius: 12px; margin-bottom: 1rem; display: flex; align-items: center; gap: 1rem; cursor: pointer; transition: 0.3s; }
        .payment-method.active { border-color: var(--primary); background: rgba(197, 160, 89, 0.05); }
        .input-group { margin-bottom: 1.5rem; }
        .input-group label { display: block; font-size: 0.8rem; font-weight: 700; margin-bottom: 0.5rem; color: #666; }
        .input-field { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px; font-size: 1rem; }
        .summary-card { background: #f1f3f5; padding: 1.5rem; border-radius: 12px; margin-bottom: 2rem; }
    </style>
</head>
<body class="demo-body">
    <nav style="background: #000;">
        <div class="logo">Marina Car</div>
        <ul class="nav-links">
            <li><a href="index.html">Retour</a></li>
            <li><a href="solutions.html">Solutions</a></li>
        </ul>
    </nav>

    <div class="payment-container">
        <div class="step-indicator">
            <div class="step active">1</div>
            <div style="flex:1; height:2px; background:#eee; align-self:center;"></div>
            <div class="step active">2</div>
            <div style="flex:1; height:2px; background:#eee; align-self:center;"></div>
            <div class="step">3</div>
        </div>

        <h2 style="margin-bottom: 1.5rem;">Paiement Sécurisé</h2>
        
        <div class="summary-card">
            <div style="display:flex; justify-content:space-between; margin-bottom:0.5rem;">
                <span>Mercedes Classe G</span>
                <span style="font-weight:700;">1,500 MAD/j</span>
            </div>
            <div style="display:flex; justify-content:space-between; font-size:0.9rem; color:#666;">
                <span>Durée: 3 jours</span>
                <span>4,500 MAD</span>
            </div>
            <div style="border-top:1px solid #ddd; margin-top:1rem; pt:1rem; display:flex; justify-content:space-between; font-weight:900; font-size:1.2rem;">
                <span>Total</span>
                <span style="color:var(--primary);">4,500 MAD</span>
            </div>
        </div>

        <div class="input-group">
            <label>Mode de paiement</label>
            <div class="payment-method active">
                <i class="fas fa-credit-card"></i>
                <div>
                    <div style="font-weight:700;">Carte Bancaire</div>
                    <div style="font-size:0.7rem; color:#888;">CMI, Visa, Mastercard</div>
                </div>
            </div>
            <div class="payment-method">
                <i class="fab fa-apple-pay" style="font-size:1.5rem;"></i>
                <span>Apple Pay</span>
            </div>
        </div>

        <div class="input-group">
            <label>Numéro de carte</label>
            <input type="text" class="input-field" placeholder="0000 0000 0000 0000">
        </div>

        <div style="display:grid; grid-template-columns:1fr 1fr; gap:15px; margin-bottom:2rem;">
            <div class="input-group">
                <label>Date d'expiration</label>
                <input type="text" class="input-field" placeholder="MM/YY">
            </div>
            <div class="input-group">
                <label>CVC</label>
                <input type="text" class="input-field" placeholder="123">
            </div>
        </div>

        <button class="cta-button" style="width:100%; padding:1.2rem;" onclick="alert('Démo: Paiement validé ! Redirection vers votre espace client...')">Payer Maintenant</button>
        
        <div style="text-align:center; margin-top:1.5rem; font-size:0.7rem; color:#aaa;">
            <i class="fas fa-lock"></i> Paiement 100% sécurisé via protocole SSL
        </div>
    </div>
</body>
</html>
