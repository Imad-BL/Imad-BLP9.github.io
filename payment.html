<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Paiement Sécurisé | Démo Marina Car</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="demo-body-light">
    <nav style="background: #000;">
        <div class="logo">Marina Car</div>
        <ul class="nav-links">
            <li><a href="index.html">Accueil</a></li>
            <li><a href="solutions.html">Showroom</a></li>
        </ul>
    </nav>

    <div class="demo-container-luxe" style="max-width: 600px;">
        <div class="demo-card-light">
            <div class="step-bar">
                <div class="step-circle active">1</div>
                <div class="step-circle active">2</div>
                <div class="step-circle">3</div>
            </div>

            <h2 style="margin-bottom: 1.5rem; text-align: center;">Paiement Sécurisé</h2>
            
            <div style="background: #f8f9fa; padding: 1.5rem; border-radius: 12px; margin-bottom: 2rem; border-left: 4px solid var(--primary);">
                <div style="display:flex; justify-content:space-between; margin-bottom:0.5rem;">
                    <span style="font-weight: 700;">Mercedes Classe G</span>
                    <span>1,500 MAD/j</span>
                </div>
                <div style="display:flex; justify-content:space-between; font-size:0.9rem; color:#666;">
                    <span>Location 3 Jours</span>
                    <span style="font-weight: 800; color: var(--bg);">4,500 MAD</span>
                </div>
            </div>

            <div class="form-group">
                <label style="display:block; margin-bottom: 0.5rem; font-size: 0.8rem; font-weight: 700;">Mode de paiement</label>
                <div style="display: grid; gap: 10px; margin-bottom: 2rem;">
                    <div style="border: 2px solid var(--primary); padding: 1rem; border-radius: 12px; display: flex; align-items: center; gap: 1rem; background: rgba(197, 160, 89, 0.05);">
                        <i class="fas fa-credit-card" style="color: var(--primary);"></i>
                        <span style="font-weight: 700;">Carte Bancaire (CMI)</span>
                    </div>
                </div>
            </div>

            <div style="display: grid; gap: 1.5rem;">
                <input type="text" placeholder="Nom sur la carte" style="width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px;">
                <input type="text" placeholder="Numéro de carte" style="width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px;">
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
                    <input type="text" placeholder="MM/YY" style="padding: 12px; border: 1px solid #ddd; border-radius: 8px;">
                    <input type="text" placeholder="CVC" style="padding: 12px; border: 1px solid #ddd; border-radius: 8px;">
                </div>
            </div>

            <button class="cta-button" style="width:100%; margin-top: 2rem; padding: 1.2rem;" onclick="alert('Simulation: Paiement validé par la banque.')">Confirmer le Paiement</button>
            
            <p style="text-align: center; font-size: 0.7rem; color: #aaa; margin-top: 1.5rem;">
                <i class="fas fa-shield-alt"></i> Données cryptées SSL - Certifié PCI DSS
            </p>
        </div>
    </div>
</body>
</html>
