<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tracking GPS | Marina Car Admin</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .tracking-layout { display: flex; height: 100vh; background: #0a0a0a; color: #fff; overflow: hidden; }
        .map-viewport { flex: 1; background: #111 url('https://www.transparenttextures.com/patterns/carbon-fibre.png'); position: relative; }
        .tracking-aside { width: 380px; background: rgba(15, 15, 15, 0.95); backdrop-filter: blur(20px); border-left: 1px solid #222; padding: 2rem; display: flex; flex-direction: column; }
        .vehicle-marker { position: absolute; color: var(--primary); font-size: 2.5rem; transition: 1.5s cubic-bezier(0.4, 0, 0.2, 1); filter: drop-shadow(0 0 10px rgba(197, 160, 89, 0.5)); }
        .vehicle-marker.active { animation: mapPulse 2s infinite; }
        @keyframes mapPulse { 0% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.15); opacity: 0.8; } 100% { transform: scale(1); opacity: 1; } }
        .live-card { background: #1a1a1a; border-radius: 15px; padding: 1.5rem; margin-bottom: 1.2rem; border-left: 5px solid #333; cursor: pointer; transition: 0.3s; }
        .live-card.active { border-left-color: var(--primary); background: #222; }
    </style>
</head>
<body class="tracking-layout">
    <div class="map-viewport" id="map">
        <nav style="position: absolute; top: 0; left: 0; width: 100%; z-index: 100; background: linear-gradient(to bottom, rgba(0,0,0,0.8), transparent);">
            <div class="logo" style="padding: 1.5rem 2rem;">Marina Car <span style="font-size: 0.6rem; color: var(--primary);">LIVE GPS</span></div>
        </nav>
        
        <!-- Live Markers -->
        <i class="fas fa-car vehicle-marker active" id="v1" style="top: 35%; left: 45%;"></i>
        <i class="fas fa-car vehicle-marker active" id="v2" style="top: 60%; left: 28%; color: #fff;"></i>
        <i class="fas fa-car vehicle-marker active" id="v3" style="top: 48%; left: 72%; color: #27c93f;"></i>

        <div style="position: absolute; top: 2rem; left: 2rem; background: rgba(0,0,0,0.8); padding: 10px 20px; border-radius: 20px; border: 1px solid var(--primary); font-size: 0.75rem; display: flex; align-items: center; gap: 10px;">
            <i class="fas fa-satellite" style="color: var(--primary);"></i> CONNEXION SATELLITE ÉTABLIE
        </div>
    </div>

    <aside class="tracking-aside">
        <h3 style="margin-bottom: 2rem;">Surveillance Flotte</h3>
        
        <div class="live-card active">
            <div style="display: flex; justify-content: space-between; margin-bottom: 0.8rem;">
                <span style="font-weight: 900;">Mercedes G-Class</span>
                <span style="color: #2ecc71; font-size: 0.7rem; font-weight: 700;"><i class="fas fa-circle"></i> EN MOUVEMENT</span>
            </div>
            <div style="font-size: 0.8rem; color: #888; display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
                <span><i class="fas fa-tachometer-alt"></i> 64 km/h</span>
                <span><i class="fas fa-location-arrow"></i> Rabat Marina</span>
            </div>
        </div>

        <div class="live-card">
            <div style="display: flex; justify-content: space-between; margin-bottom: 0.8rem;">
                <span style="font-weight: 900;">VW Golf 8</span>
                <span style="color: #2ecc71; font-size: 0.7rem; font-weight: 700;"><i class="fas fa-circle"></i> EN MOUVEMENT</span>
            </div>
            <div style="font-size: 0.8rem; color: #888; display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
                <span><i class="fas fa-tachometer-alt"></i> 12 km/h</span>
                <span><i class="fas fa-location-arrow"></i> Agdal</span>
            </div>
        </div>

        <div class="live-card" style="border-left-color: #e74c3c;">
            <div style="display: flex; justify-content: space-between; margin-bottom: 0.8rem;">
                <span style="font-weight: 900;">Range Rover</span>
                <span style="color: #e74c3c; font-size: 0.7rem; font-weight: 700;"><i class="fas fa-circle"></i> STATIONNÉ</span>
            </div>
            <div style="font-size: 0.8rem; color: #888; display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
                <span><i class="fas fa-clock"></i> 3h 15m</span>
                <span><i class="fas fa-location-arrow"></i> Aéroport Salé</span>
            </div>
        </div>

        <div style="margin-top: auto;">
            <button class="cta-button" style="width: 100%;" onclick="alert('Module Anti-Vol: Coupure moteur à distance activée (Simulation).')">Coupure Moteur Sécurité</button>
            <p style="text-align: center; font-size: 0.65rem; color: #555; margin-top: 1.5rem;">Système sécurisé par cryptage militaire RSA-2048</p>
        </div>
    </aside>

    <script>
        // Move markers slightly to simulate live movement
        function moveCar(id) {
            const car = document.getElementById(id);
            const top = parseFloat(car.style.top);
            const left = parseFloat(car.style.left);
            car.style.top = (top + (Math.random() * 0.4 - 0.2)) + '%';
            car.style.left = (left + (Math.random() * 0.4 - 0.2)) + '%';
        }
        setInterval(() => { moveCar('v1'); moveCar('v2'); }, 2000);
    </script>
</body>
</html>
