<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tracking Live | Marina Car Admin</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .tracking-body { background: #1a1a1a; color: #fff; height: 100vh; overflow: hidden; display: flex; flex-direction: column; }
        .map-area { flex: 1; background: #222 url('https://www.transparenttextures.com/patterns/carbon-fibre.png'); position: relative; overflow: hidden; }
        .tracking-panel { width: 350px; background: rgba(15, 15, 15, 0.95); backdrop-filter: blur(10px); height: 100%; border-left: 1px solid #333; padding: 2rem; }
        .car-marker { position: absolute; color: var(--primary); font-size: 2rem; cursor: pointer; transition: 1s ease; }
        .car-marker.active { animation: pulse 2s infinite; }
        @keyframes pulse { 0% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.2); opacity: 0.7; } 100% { transform: scale(1); opacity: 1; } }
        .status-card { background: #252525; padding: 1rem; border-radius: 10px; margin-bottom: 1rem; border-left: 4px solid #444; cursor: pointer; }
        .status-card.active { border-left-color: var(--primary); background: #333; }
    </style>
</head>
<body class="tracking-body">
    <nav style="background: #000;">
        <div class="logo">Marina Car</div>
        <ul class="nav-links">
            <li><a href="index.html">Accueil</a></li>
            <li><a href="solutions.html">Démos</a></li>
        </ul>
        <div style="color:var(--primary); font-weight:900;">LIVE TRACKING SYSTEM</div>
    </nav>

    <div style="display:flex; flex:1;">
        <div class="map-area">
            <!-- Simulated markers -->
            <i class="fas fa-car car-marker active" id="m1" style="top: 30%; left: 40%;"></i>
            <i class="fas fa-car car-marker active" id="m2" style="top: 60%; left: 25%; color: #fff;"></i>
            <i class="fas fa-car car-marker active" id="m3" style="top: 45%; left: 70%; color: #27c93f;"></i>
        </div>

        <div class="tracking-panel">
            <h3 style="margin-bottom: 2rem;">Flotte en mouvement</h3>
            
            <div class="status-card active">
                <div style="display:flex; justify-content:space-between; margin-bottom:0.5rem;">
                    <span style="font-weight:700;">Mercedes G-Class</span>
                    <span style="color:#27c93f; font-size:0.7rem;"><i class="fas fa-circle"></i> En ligne</span>
                </div>
                <div style="font-size:0.8rem; color:#aaa;">
                    <p><i class="fas fa-tachometer-alt"></i> Vitesse: 65 km/h</p>
                    <p><i class="fas fa-map-marker-alt"></i> Zone: Rabat Marina</p>
                </div>
            </div>

            <div class="status-card">
                <div style="display:flex; justify-content:space-between; margin-bottom:0.5rem;">
                    <span style="font-weight:700;">VW Golf 8</span>
                    <span style="color:#27c93f; font-size:0.7rem;"><i class="fas fa-circle"></i> En ligne</span>
                </div>
                <div style="font-size:0.8rem; color:#aaa;">
                    <p><i class="fas fa-tachometer-alt"></i> Vitesse: 12 km/h</p>
                    <p><i class="fas fa-map-marker-alt"></i> Zone: Hay Riad</p>
                </div>
            </div>

            <div class="status-card" style="border-left-color: #ff5f56;">
                <div style="display:flex; justify-content:space-between; margin-bottom:0.5rem;">
                    <span style="font-weight:700;">Range Rover</span>
                    <span style="color:#ff5f56; font-size:0.7rem;"><i class="fas fa-circle"></i> Stationné</span>
                </div>
                <div style="font-size:0.8rem; color:#aaa;">
                    <p><i class="fas fa-clock"></i> Depuis 4h 12m</p>
                    <p><i class="fas fa-map-marker-alt"></i> Zone: Aéroport Salé</p>
                </div>
            </div>

            <button class="cta-button" style="width:100%; margin-top:2rem;" onclick="alert('Simulation: Données GPS actualisées via Satellite.')">Actualiser Flux</button>
        </div>
    </div>

    <script>
        setInterval(() => {
            const m1 = document.getElementById('m1');
            const top = parseInt(m1.style.top);
            m1.style.top = (top + (Math.random() * 1 - 0.5)) + '%';
        }, 1000);
    </script>
</body>
</html>
